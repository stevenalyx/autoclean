{% extends 'base.html' %}
{% block title %}{{ titulo }} · AUTOCLEAN{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card border-danger shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 text-danger">{{ titulo }}</h1>
        <p>¿Está seguro de que desea eliminar <strong>{{ objeto }}</strong>? Esta acción no se puede deshacer.</p>
        {% if advertencia %}<p class="text-muted small">{{ advertencia }}</p>{% endif %}
        <form method="post" class="d-flex gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          <a href="{% url cancel_url %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
